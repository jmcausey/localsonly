<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="900">
<title>{% block title %}Locals Only{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
  .topbar nav{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
  .live-clock{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
  .weather-subnav{display:flex;align-items:center;gap:1rem;padding:.5rem 1rem;background:#eef5f8;border-bottom:1px solid #d7e2e8}
  .weather-subnav a{color:#36515f;text-decoration:none;font-weight:600}
  .weather-subnav a:hover{color:#111}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}">LOCALS ONLY</a>
  <nav>
    <a href="{{ url_for('weather') }}">Weather</a>
    <a href="{{ url_for('astronomy') }}">Astronomy</a>
    <a href="{{ url_for('listings') }}">CL</a>
    <a href="{{ url_for('facebook') }}">FB</a>
    <span class="live-clock" id="live-clock" aria-label="Current time">--:--:-- --</span>
    {% if current_user %}
      <span>{{ current_user.name or current_user.email }}</span>
      <a href="{{ url_for('google_logout') }}">Log out</a>
    {% else %}
      <a href="{{ url_for('google_login') }}">Login</a>
    {% endif %}
  </nav>
</header>
<nav class="weather-subnav" aria-label="Weather navigation">
  <a href="{{ url_for('weather') }}">Current Weather</a>
  <a href="{{ url_for('forecast') }}">Forecast</a>
</nav>
<main>{% block content %}{% endblock %}</main>
<footer>Local information from CL · Weather · Astronomy</footer>
<script>
  function updateClock() {
    const e = document.getElementById("live-clock");
    if (e) e.textContent = new Date().toLocaleTimeString("en-US", {
      hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true
    });
  }
  updateClock();
  setInterval(updateClock, 1000);
</script>
</body>
</html>
