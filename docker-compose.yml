services:
  localsonly:
    build: .
    container_name: localsonly
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      CL_SERVICE_URL: http://cl:5001
      WEATHER_SERVICE_URL: http://weather:5002
      ASTRONOMY_SERVICE_URL: http://astronomy:5003
      CL_PUBLIC_URL: ${CL_PUBLIC_URL:-http://localhost:5001}
      WEATHER_PUBLIC_URL: ${WEATHER_PUBLIC_URL:-http://localhost:5002}
      ASTRONOMY_PUBLIC_URL: ${ASTRONOMY_PUBLIC_URL:-http://localhost:5003}
    networks:
      - cl_shared_data

networks:
  cl_shared_data:
    external: true
