{% extends "base.html" %}
{% block title %}{{ title }} — Locals Only{% endblock %}
{% block content %}
<section class="service-header"><span class="eyebrow">LOCALS ONLY</span><h1>{{ title }}</h1><p>Presented by the {{ title }} service.</p></section>
<iframe class="service-frame" src="{{ service_url }}" title="{{ title }}" scrolling="no"></iframe>
<script>
  (() => {
    const frame = document.currentScript.previousElementSibling;
    const resize = (event) => {
      if (event.source !== frame.contentWindow) return;
      if (event.data?.type !== "localsonly-height") return;
      const height = Math.max(100, Number(event.data.height) || 0);
      frame.style.height = height + "px";
    };
    const requestHeight = () => {
      try { frame.contentWindow.postMessage({type: "localsonly-request-height"}, "*"); } catch (e) {}
    };
    window.addEventListener("message", resize);
    frame.addEventListener("load", requestHeight);
    window.addEventListener("load", requestHeight);
    setTimeout(requestHeight, 250);
  })();
</script>
{% endblock %}
